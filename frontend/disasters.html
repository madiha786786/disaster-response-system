<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disasters - Disaster Response AI</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
    /* Clean Minimal Variables */
    :root {
        --primary-blue: #1a73e8;
        --hover-blue: #f8faff;
        --border-color: #dadce0;
        --text-main: #3c4043;
    }

    /* Modal Smoothing */
    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(32, 33, 36, 0.6);
        backdrop-filter: blur(2px);
        z-index: 1000;
        align-items: center;
        justify-content: center;
    }

    .modal.active {
        display: flex;
        animation: fadeIn 0.2s ease-out;
    }

    .modal-content {
        background: white;
        border-radius: 12px;
        width: 100%;
        max-width: 500px;
        box-shadow: 0 12px 24px rgba(0,0,0,0.15);
        overflow: hidden;
        transform: translateY(0);
        transition: transform 0.3s ease;
    }

    /* Form Styling */
    .modal-body {
        padding: 24px;
        max-height: 80vh;
        overflow-y: auto;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        font-size: 14px;
        font-weight: 500;
        color: var(--text-main);
        margin-bottom: 8px;
    }

    .form-group input, 
    .form-group select {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        font-size: 15px;
        transition: border-color 0.2s;
        box-sizing: border-box; /* Prevents overflow */
    }

    .form-group input:focus {
        outline: none;
        border-color: var(--primary-blue);
        box-shadow: 0 0 0 2px rgba(26,115,232,0.1);
    }

    /* Auto-Detect Button Styling */
    .location-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        margin-top: 10px;
        padding: 8px;
        background: var(--hover-blue);
        color: var(--primary-blue);
        border: 1px dashed var(--primary-blue);
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
        transition: all 0.2s;
    }

    .location-btn:hover {
        background: #e8f0fe;
    }

    /* Coordinate Grid */
    .coords-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .read-only-input {
        background-color: #f8f9fa;
        color: #70757a;
        cursor: not-allowed;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
</style>
</head>
<body>
    <div class="content-area">
        <!-- Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <h1 style="font-size: 24px; font-weight: 500;">Disaster Cases</h1>
            <button class="btn btn-primary" onclick="openAddDisaster()">
                <span class="material-icons" style="font-size: 18px; vertical-align: middle;">add</span>
                Add Disaster
            </button>
        </div>

        <!-- Filters -->
        <div class="card" style="margin-bottom: 20px;">
            <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                <select id="statusFilter" onchange="loadDisasters()" style="padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color);">
                    <option value="all">All Status</option>
                    <option value="pending">Pending</option>
                    <option value="assigned">Assigned</option>
                    <option value="resolved">Resolved</option>
                </select>
                <select id="typeFilter" onchange="loadDisasters()" style="padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color);">
                    <option value="all">All Types</option>
                    <option value="rescue">Rescue</option>
                    <option value="flood">Flood</option>
                    <option value="medical">Medical</option>
                    <option value="fire">Fire</option>
                    <option value="accident">Accident</option>
                    <option value="food">Food</option>
                </select>
                <button class="btn btn-outline" onclick="loadDisasters()">
                    <span class="material-icons" style="font-size: 18px;">refresh</span>
                    Refresh
                </button>
            </div>
        </div>

        <!-- Disasters Table -->
        <div class="card">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Location</th>
                        <th>Type</th>
                        <th>Urgency</th>
                        <th>People</th>
                        <th>Status</th>
                        <th>Priority Score</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="disastersTableBody">
                    <tr>
                        <td colspan="7" style="text-align: center;">Loading disasters...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add Disaster Modal -->
    <div id="disasterModal" class="modal">
    <div class="modal-content" style="display: flex; flex-direction: column; max-height: 90vh;">
        <div class="modal-header" style="padding: 16px 24px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;">
            <h3 style="margin: 0; font-weight: 500;">Register New Disaster</h3>
            <span class="material-icons" onclick="closeModal('disasterModal')" style="cursor: pointer; color: #5f6368;">close</span>
        </div>
        
        <div class="modal-body" style="padding: 24px; overflow-y: auto; flex-grow: 1;">
            <form id="disasterForm">
                <div class="form-group">
                    <label>Incident Location *</label>
                    <input type="text" id="disasterLocation" required placeholder="Street, area, or landmark">
                    <button type="button" class="location-btn" onclick="getDisasterLocation()">
                        <span class="material-icons" style="font-size: 18px;">my_location</span>
                        Auto-Detect My Location
                    </button>
                </div>

                <div class="form-group">
                    <label>GPS Coordinates</label>
                    <div class="coords-grid">
                        <input type="text" id="disasterLat" placeholder="Latitude" readonly class="read-only-input">
                        <input type="text" id="disasterLng" placeholder="Longitude" readonly class="read-only-input">
                    </div>
                    <small style="color: #70757a; font-size: 11px; margin-top: 4px; display: block;">Populated via auto-detection</small>
                </div>

                <hr style="border: 0; border-top: 1px solid #f1f3f4; margin: 20px 0;">

                <div class="form-group">
                    <label>Disaster Type *</label>
                    <select id="disasterType" required>
                        <option value="rescue">Rescue Operation</option>
                        <option value="flood">Flood</option>
                        <option value="medical">Medical Emergency</option>
                        <option value="fire">Fire</option>
                        <option value="accident">Accident</option>
                        <option value="food">Food Distribution</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Urgency Level *</label>
                    <select id="disasterUrgency" required>
                        <option value="high">High - Immediate Response</option>
                        <option value="medium">Medium - Within the hour</option>
                        <option value="low">Low - General Assistance</option>
                    </select>
                </div>

                <div class="form-group" style="margin-bottom: 10px;">
                    <label>People Affected *</label>
                    <input type="number" id="disasterPeople" required min="1" placeholder="Enter estimated count">
                </div>
            </form>
        </div>

        <div class="modal-footer" style="padding: 16px 24px; border-top: 1px solid #eee; display: flex; justify-content: flex-end; gap: 12px; background: #f8f9fa; flex-shrink: 0;">
            <button class="btn btn-outline" onclick="closeModal('disasterModal')" style="border: none; background: transparent; cursor: pointer;">Cancel</button>
            <button class="btn btn-primary" onclick="submitDisaster()" style="padding: 10px 24px; border-radius: 8px; cursor: pointer; background-color: var(--primary-blue); color: white; border: none; font-weight: 500;">Register Disaster</button>
        </div>
    </div>
</div>
    </div>

    <!-- Disaster Detail Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h3>Disaster Details</h3>
                <span class="material-icons" onclick="closeModal('detailModal')" style="cursor: pointer;">close</span>
            </div>
            <div class="modal-body" id="detailContent">
                Loading...
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal('detailModal')">Close</button>
                <button class="btn btn-primary" id="assignFromDetailBtn" onclick="assignFromDetail()">Assign Volunteer</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://disaster-response-system-hd8a.onrender.com/api';
        //   const API_URL='http://localhost:5001/api';

        let currentDisaster = null;

        async function loadDisasters() {
            try {
                const status = document.getElementById('statusFilter').value;
                const type = document.getElementById('typeFilter').value;
                
                let url = `${API_URL}/disasters`;
                const response = await fetch(url);
                let disasters = await response.json();
                
                // Apply filters
                if (status !== 'all') {
                    disasters = disasters.filter(d => d.status === status);
                }
                if (type !== 'all') {
                    disasters = disasters.filter(d => d.type === type);
                }
                
                displayDisasters(disasters);
            } catch (error) {
                console.error('Error loading disasters:', error);
                document.getElementById('disastersTableBody').innerHTML = `
                    <tr><td colspan="7" style="text-align: center; color: red;">Error loading disasters</td></tr>
                `;
            }
        }

        function displayDisasters(disasters) {
            const tbody = document.getElementById('disastersTableBody');
            
            if (!disasters || disasters.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">No disasters found</td></tr>';
                return;
            }
            
            tbody.innerHTML = disasters.map(disaster => `
                <tr>
                    <td>${disaster.location}</td>
                    <td><span style="text-transform: capitalize;">${disaster.type}</span></td>
                    <td><span class="badge badge-${disaster.urgency}">${disaster.urgency.toUpperCase()}</span></td>
                    <td>${disaster.peopleAffected}</td>
                    <td><span class="badge" style="background: ${getStatusColor(disaster.status)}">${disaster.status}</span></td>
                    <td><strong>${disaster.priorityScore}</strong></td>
                    <td>
                        <button class="btn btn-outline" style="padding: 4px 12px; margin-right: 8px;" onclick="viewDetails('${disaster._id}')">
                            View
                        </button>
                        ${disaster.status === 'pending' ? `
                            <button class="btn btn-primary" style="padding: 4px 12px;" onclick="openRecommendation('${disaster._id}')">
                                Assign
                            </button>
                        ` : ''}
                    </td>
                </tr>
            `).join('');
        }

        function getStatusColor(status) {
            switch(status) {
                case 'pending': return '#fef7e0';
                case 'assigned': return '#e8f0fe';
                case 'resolved': return '#e6f4ea';
                default: return '#f1f3f4';
            }
        }

        async function viewDetails(id) {
            try {
                const response = await fetch(`${API_URL}/disasters/${id}`);
                const data = await response.json();
                currentDisaster = data.disaster;
                
                const detailContent = document.getElementById('detailContent');
                detailContent.innerHTML = `
                    <div class="form-group">
                        <label>Location</label>
                        <div><strong>${data.disaster.location}</strong></div>
                    </div>
                    <div class="form-group">
                        <label>Type</label>
                        <div><strong style="text-transform: capitalize;">${data.disaster.type}</strong></div>
                    </div>
                    <div class="form-group">
                        <label>Urgency</label>
                        <div><span class="badge badge-${data.disaster.urgency}">${data.disaster.urgency.toUpperCase()}</span></div>
                    </div>
                    <div class="form-group">
                        <label>People Affected</label>
                        <div><strong>${data.disaster.peopleAffected}</strong></div>
                    </div>
                    <div class="form-group">
                        <label>Priority Score</label>
                        <div><strong>${data.disaster.priorityScore}/100</strong></div>
                    </div>
                    ${data.disaster.assignedVolunteer ? `
                        <div class="form-group">
                            <label>Assigned Volunteer</label>
                            <div><strong>${data.disaster.assignedVolunteer.name}</strong> (${data.disaster.assignedVolunteer.skills.join(', ')})</div>
                        </div>
                    ` : '<div class="form-group"><label>Status</label><div>Pending Assignment</div></div>'}
                `;
                
                document.getElementById('detailModal').classList.add('active');
            } catch (error) {
                console.error('Error loading disaster details:', error);
                alert('Failed to load disaster details');
            }
        }

        async function openRecommendation(disasterId) {
            window.parent.location.href = `allocation.html?disaster=${disasterId}`;
        }

        function assignFromDetail() {
            if (currentDisaster) {
                openRecommendation(currentDisaster._id);
                closeModal('detailModal');
            }
        }

        function openAddDisaster() {
            document.getElementById('disasterModal').classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }
        // Auto-detect disaster location
function getDisasterLocation() {
    if (!navigator.geolocation) {
        alert('Geolocation is not supported by your browser');
        return;
    }

    const btn = event.target.closest('button');
    const originalText = btn.innerHTML;
    btn.innerHTML = '<span class="material-icons">hourglass_top</span> Detecting...';
    btn.disabled = true;

    navigator.geolocation.getCurrentPosition(
        (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            
            document.getElementById('disasterLat').value = lat;
            document.getElementById('disasterLng').value = lng;
            
            // Reverse geocode to get address
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
                .then(res => res.json())
                .then(data => {
                    const address = data.display_name || `${lat}, ${lng}`;
                    document.getElementById('disasterLocation').value = address;
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    alert('✅ Location detected successfully!');
                })
                .catch(() => {
                    document.getElementById('disasterLocation').value = `${lat}, ${lng}`;
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    alert('✅ Location coordinates captured!');
                });
        },
        (error) => {
            console.error('Location error:', error);
            btn.innerHTML = originalText;
            btn.disabled = false;
            alert('Unable to get location. Please enter manually.');
        },
        { enableHighAccuracy: true, timeout: 10000 }
    );
}

        async function submitDisaster() {
            const disaster = {
                location: document.getElementById('disasterLocation').value,
                type: document.getElementById('disasterType').value,
                urgency: document.getElementById('disasterUrgency').value,
                peopleAffected: parseInt(document.getElementById('disasterPeople').value),
                coordinates: {}
            };
            
            const lat = document.getElementById('disasterLat').value;
            const lng = document.getElementById('disasterLng').value;
            if (lat && lng) {
                disaster.coordinates = { lat: parseFloat(lat), lng: parseFloat(lng) };
            }
            
            try {
                const response = await fetch(`${API_URL}/disasters`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(disaster)
                });
                
             
    if (response.ok) {
    const data = await response.json();
    
    // Create VISIBLE popup on screen
    const popup = document.createElement('div');
    popup.style.cssText = `
        position: fixed;
        top: 80px;
        right: 20px;
        background: linear-gradient(135deg, #d93025, #ea4335);
        color: white;
        padding: 20px;
        border-radius: 12px;
        z-index: 10000;
        animation: slideIn 0.3s ease;
        box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        max-width: 350px;
        cursor: pointer;
        font-family: 'Google Sans', Arial, sans-serif;
    `;
    popup.innerHTML = `
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
            <span style="font-size: 24px;">🚨</span>
            <strong style="font-size: 18px;">NEW DISASTER ALERT!</strong>
        </div>
        <div style="font-size: 14px; line-height: 1.5;">
            📍 ${disaster.location}<br>
            🔥 Type: ${disaster.type.toUpperCase()}<br>
            👥 People: ${disaster.peopleAffected}<br>
            ⚡ Urgency: ${disaster.urgency.toUpperCase()}
        </div>
        <hr style="margin: 10px 0; border-color: rgba(255,255,255,0.3);">
        <small>⚠️ Nearby volunteers have been notified! Click to assign →</small>
    `;
    popup.onclick = () => {
        window.location.href = `allocation.html?disaster=${data._id}`;
    };
    document.body.appendChild(popup);
    
    // Auto remove after 10 seconds
    setTimeout(() => popup.remove(), 10000);
    
    alert('✅ Disaster registered successfully!');
    closeModal('disasterModal');
    loadDisasters();
    document.getElementById('disasterForm').reset();
}
    // Test notification
   else {
                    const error = await response.json();
                    alert('Error: ' + error.message);
                }
            } catch (error) {
                console.error('Error submitting disaster:', error);
                alert('Failed to register disaster');
            }
        }

        // Load disasters on page load
        loadDisasters();
    </script>
</body>
</html>
