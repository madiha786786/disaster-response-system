<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Disaster Response AI</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1a73e8;
            --border-color: #dadce0;
        }

        /* Essential UI Fix: Force the page to stay within the viewport */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        .content-area {
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .recent-list {
            max-height: 350px;
            overflow-y: auto;
        }

        .recent-item {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
        }

        /* The UX Fix: Constrain the address words */
        .item-info {
            flex: 1;
            min-width: 0; /* Allows truncation to happen */
            padding-right: 15px;
        }

        .location-text {
            font-weight: 500;
            color: #202124;
            display: block;
            margin-bottom: 4px;
            
            /* HARD LIMIT: This stops the text from pushing the UI */
            max-width: 250px; /* Adjust this value if you want more/less words visible */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis; 
        }

        /* Keep badges pinned to the right */
        .badge-group {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            flex-shrink: 0; /* Badges will NEVER shrink or move */
        }

        .score-badge {
            background: var(--primary-blue);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            white-space: nowrap;
        }

        /* Quick Action Buttons - Navigation only */
        .btn-quick {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: transform 0.1s;
        }

        .btn-quick:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="content-area">
        <!-- Stats Cards -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-icon" style="background: #e8f0fe;"><span class="material-icons" style="color: var(--primary-blue);">warning</span></div>
                <div class="stat-value" id="totalDisasters">-</div>
                <div class="stat-label">Total Disasters</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: #fce8e6;"><span class="material-icons" style="color: #d93025;">emergency</span></div>
                <div class="stat-value" id="activeDisasters">-</div>
                <div class="stat-label">Active Disasters</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: #e6f4ea;"><span class="material-icons" style="color: #188038;">people</span></div>
                <div class="stat-value" id="totalVolunteers">-</div>
                <div class="stat-label">Total Volunteers</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: #fef7e0;"><span class="material-icons" style="color: #f29900;">check_circle</span></div>
                <div class="stat-value" id="availableVolunteers">-</div>
                <div class="stat-label">Available Volunteers</div>
            </div>
        </div>

        <!-- Dashboard Lists -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px;">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">🚩 Urgent Cases</h3>
                    <button class="btn btn-outline" onclick="viewAllDisasters()">View All</button>
                </div>
                <div id="urgentDisasters" class="recent-list"></div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Recent Assignments</h3>
                    <button class="btn btn-outline" onclick="viewAllocations()">View All</button>
                </div>
                <div id="recentAssignments" class="recent-list"></div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="card">
            <div class="card-header"><h3 class="card-title">⚡ Quick Actions</h3></div>
            <div style="display: flex; gap: 15px; padding: 20px; flex-wrap: wrap;">
                <button class="btn btn-primary btn-quick" onclick="viewAllDisasters()">
                    <span class="material-icons">campaign</span> Register Disaster
                </button>
                <button class="btn btn-primary btn-quick" onclick="goToVolunteers()">
                    <span class="material-icons">person_add</span> Register Volunteer
                </button>
                <button class="btn btn-outline btn-quick" onclick="viewAllocations()">
                    <span class="material-icons">bolt</span> AI Allocation
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://disaster-response-system-hd8a.onrender.com/api';

        async function loadDashboard() {
            try {
                const response = await fetch(`${API_URL}/analytics/dashboard`);
                const data = await response.json();
                
                document.getElementById('totalDisasters').textContent = data.stats.disasters.total;
                document.getElementById('activeDisasters').textContent = data.stats.disasters.active;
                document.getElementById('totalVolunteers').textContent = data.stats.volunteers.total;
                document.getElementById('availableVolunteers').textContent = data.stats.volunteers.available;
                
                displayUrgentDisasters(data.urgentDisasters);
                displayRecentAssignments(data.recentAssignments);
            } catch (error) { console.error(error); }
        }

        function displayUrgentDisasters(disasters) {
            const container = document.getElementById('urgentDisasters');
            container.innerHTML = disasters.slice(0, 5).map(disaster => `
                <div class="recent-item">
                    <div class="item-info">
                        <span class="location-text" title="${disaster.location}">${disaster.location}</span>
                        <div style="font-size: 11px; color: #70757a;">${disaster.type} • ${disaster.peopleAffected} affected</div>
                    </div>
                    <div class="badge-group">
                        <span class="badge badge-${disaster.urgency}">${disaster.urgency.toUpperCase()}</span>
                        <span class="score-badge">PRIORITY: ${disaster.priorityScore}</span>
                    </div>
                </div>
            `).join('');
        }

        function displayRecentAssignments(assignments) {
            const container = document.getElementById('recentAssignments');
            container.innerHTML = assignments.slice(0, 5).map(assignment => `
                <div class="recent-item">
                    <div class="item-info">
                        <span class="location-text">${assignment.volunteer?.name || 'Volunteer'}</span>
                        <div style="font-size: 11px; color: #70757a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                            📍 ${assignment.disaster?.location || 'Unknown'}
                        </div>
                    </div>
                    <div class="badge-group">
                        <span class="score-badge" style="background: #34a853;">MATCH: ${assignment.matchScore}%</span>
                    </div>
                </div>
            `).join('');
        }

        function viewAllDisasters() { window.parent.location.href = 'disasters.html'; }
        function goToVolunteers() { window.parent.location.href = 'volunteers.html'; }
        function viewAllocations() { window.parent.location.href = 'allocation.html'; }

        loadDashboard();
    </script>
</body>
</html>
