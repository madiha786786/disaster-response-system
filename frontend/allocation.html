<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Allocation - Disaster Response AI</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        .allocation-container {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 24px;
        }
        
        .disaster-list {
            max-height: 600px;
            overflow-y: auto;
        }
        
        .disaster-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .disaster-card:hover {
            transform: translateX(4px);
            box-shadow: var(--shadow-md);
        }
        
        .disaster-card.selected {
            border-color: var(--primary-color);
            background: #e8f0fe;
        }
        
        .recommendation-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            transition: all 0.2s;
        }
        
        .recommendation-card:hover {
            box-shadow: var(--shadow-md);
        }
        
        .score-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), #34a853);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
        }
        
        .breakdown-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }
        
        .breakdown-item:last-child {
            border-bottom: none;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .loading-pulse {
            animation: pulse 1.5s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="content-area">
        <div style="margin-bottom: 24px;">
            <h1 style="font-size: 24px; font-weight: 500;">🧠 Smart AI Allocation Engine</h1>
            <p style="color: var(--text-secondary); margin-top: 8px;">AI-powered volunteer matching based on skills, distance, and availability</p>
        </div>

        <div class="allocation-container">
            <!-- Left: Disaster Cases -->
            <div>
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Pending Disasters</h3>
                        <span id="pendingCount" class="badge" style="background: var(--primary-color); color: white;">0</span>
                    </div>
                    <div id="disasterList" class="disaster-list">
                        <div class="loading-pulse" style="text-align: center; padding: 40px;">Loading disasters...</div>
                    </div>
                </div>
            </div>

            <!-- Right: Recommendations -->
            <div>
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">🤖 AI Recommendations</h3>
                        <button id="autoAssignBtn" class="btn btn-primary" onclick="autoAssignAll()" style="display: none;">
                            <span class="material-icons" style="font-size: 18px;">auto_awesome</span>
                            Auto-Assign All
                        </button>
                    </div>
                    <div id="recommendationsList">
                        <div style="text-align: center; padding: 60px 20px; color: var(--text-secondary);">
                            <span class="material-icons" style="font-size: 48px; margin-bottom: 16px;">psychology</span>
                            <p>Select a disaster from the left to see AI recommendations</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://disaster-response-system-hd8a.onrender.com/api';
        let selectedDisaster = null;
        let recommendations = [];

        async function loadDisasters() {
            try {
                const response = await fetch(`${API_URL}/disasters`);
                const disasters = await response.json();
                const pendingDisasters = disasters.filter(d => d.status === 'pending');
                
                document.getElementById('pendingCount').textContent = pendingDisasters.length;
                
                if (pendingDisasters.length === 0) {
                    document.getElementById('disasterList').innerHTML = `
                        <div style="text-align: center; padding: 40px; color: var(--text-secondary);">
                            <span class="material-icons" style="font-size: 48px;">check_circle</span>
                            <p>No pending disasters! Great job!</p>
                        </div>
                    `;
                    document.getElementById('autoAssignBtn').style.display = 'none';
                    return;
                }
                
                document.getElementById('autoAssignBtn').style.display = 'block';
                
                document.getElementById('disasterList').innerHTML = pendingDisasters.map(disaster => `
                    <div class="disaster-card" onclick="selectDisaster('${disaster._id}')" data-id="${disaster._id}">
                        <div style="display: flex; justify-content: space-between; align-items: start;">
                            <div>
                                <div style="font-weight: 500; margin-bottom: 4px;">📍 ${disaster.location}</div>
                                <div style="font-size: 14px; color: var(--text-secondary);">
                                    ${disaster.type} • ${disaster.peopleAffected} people
                                </div>
                            </div>
                            <span class="badge badge-${disaster.urgency}">${disaster.urgency}</span>
                        </div>
                        <div style="margin-top: 8px;">
                            <span class="badge" style="background: #e8f0fe;">Score: ${disaster.priorityScore}</span>
                        </div>
                    </div>
                `).join('');
                
                // If there's a disaster ID in URL, select it
                const urlParams = new URLSearchParams(window.location.search);
                const disasterId = urlParams.get('disaster');
                if (disasterId && pendingDisasters.find(d => d._id === disasterId)) {
                    selectDisaster(disasterId);
                }
            } catch (error) {
                console.error('Error loading disasters:', error);
            }
        }

        async function selectDisaster(disasterId) {
            // Update UI
            document.querySelectorAll('.disaster-card').forEach(card => {
                card.classList.remove('selected');
                if (card.getAttribute('data-id') === disasterId) {
                    card.classList.add('selected');
                }
            });
            
            selectedDisaster = disasterId;
            
            // Load recommendations
            try {
                const response = await fetch(`${API_URL}/allocation/recommend/${disasterId}`);
                const data = await response.json();
                recommendations = data.recommendations;
                displayRecommendations(data.disaster, data.recommendations);
            } catch (error) {
                console.error('Error loading recommendations:', error);
            }
        }

        function displayRecommendations(disaster, recommendations) {
            const container = document.getElementById('recommendationsList');
            
            if (!recommendations || recommendations.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: var(--text-secondary);">
                        <span class="material-icons" style="font-size: 48px;">sentiment_dissatisfied</span>
                        <p>No volunteers available for this disaster</p>
                        <p style="font-size: 14px;">Please register more volunteers</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = `
                <div style="margin-bottom: 16px; padding: 12px; background: #e8f0fe; border-radius: 8px;">
                    <strong>🎯 Selected Disaster:</strong> ${disaster.type} at ${disaster.location}
                    <br>
                    <small>Priority Score: ${disaster.priorityScore} | People Affected: ${disaster.peopleAffected}</small>
                </div>
                ${recommendations.map((rec, index) => `
                    <div class="recommendation-card">
                        <div style="display: flex; gap: 16px; align-items: center; margin-bottom: 16px;">
                            <div class="score-circle">${rec.score}</div>
                            <div style="flex: 1;">
                                <div style="font-weight: 500; font-size: 18px;">${rec.volunteer.name}</div>
                                <div style="color: var(--text-secondary); font-size: 14px;">
                                    ${rec.volunteer.skills.join(', ')} • ${rec.volunteer.location}
                                </div>
                            </div>
                            ${index === 0 ? '<span class="badge" style="background: #34a853; color: white;">🏆 Best Match</span>' : ''}
                        </div>
                        
                        <div style="margin: 12px 0; padding: 12px; background: #f8f9fa; border-radius: 8px;">
                            <div class="breakdown-item">
                                <span>🎯 Skill Match</span>
                                <span><strong>${rec.breakdown.skillMatch}/50</strong></span>
                            </div>
                            <div class="breakdown-item">
                                <span>☄ Distance Match</span>
                                <span><strong>${rec.breakdown.distanceMatch}/30</strong> (${rec.breakdown.distance?.toFixed(1) || '?'} km)</span>
                            </div>
                            <div class="breakdown-item">
                                <span>✔ Availability</span>
                                <span><strong>${rec.breakdown.availabilityMatch}/25</strong></span>
                            </div>
                            <div class="breakdown-item">
                                <span>⭐ Experience</span>
                                <span><strong>${rec.breakdown.experienceMatch}/15</strong></span>
                            </div>
                        </div>
                        
                        <button class="btn btn-primary" style="width: 100%;" onclick="assignVolunteer('${selectedDisaster}', '${rec.volunteer._id}')">
                            <span class="material-icons" style="font-size: 18px;">check_circle</span>
                            Assign ${rec.volunteer.name}
                        </button>
                    </div>
                `).join('')}
            `;
        }

        async function assignVolunteer(disasterId, volunteerId) {
            try {
                const response = await fetch(`${API_URL}/allocation/assign`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ disasterId, volunteerId })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    alert(`✅ Successfully assigned!\n\nMatch Score: ${result.scoreDetails.total}/100\nEstimated arrival: ${result.assignment.estimatedArrival ? new Date(result.assignment.estimatedArrival).toLocaleTimeString() : 'ASAP'}`);
                    loadDisasters();
                    document.getElementById('recommendationsList').innerHTML = `
                        <div style="text-align: center; padding: 40px; color: var(--text-secondary);">
                            <span class="material-icons" style="font-size: 48px;">check_circle</span>
                            <p>Volunteer assigned successfully!</p>
                            <p style="font-size: 14px;">Select another disaster to continue</p>
                        </div>
                    `;
                    selectedDisaster = null;
                } else {
                    const error = await response.json();
                    alert('Error: ' + error.message);
                }
            } catch (error) {
                console.error('Error assigning volunteer:', error);
                alert('Failed to assign volunteer');
            }
        }

        async function autoAssignAll() {
            if (!confirm('This will automatically assign the best available volunteers to all pending disasters. Continue?')) return;
            
            try {
                const response = await fetch(`${API_URL}/allocation/auto-assign`, {
                    method: 'POST'
                });
                const result = await response.json();
                alert(`✅ Auto-allocation complete!\nAssigned ${result.assignments.length} disasters`);
                loadDisasters();
                document.getElementById('recommendationsList').innerHTML = `
                    <div style="text-align: center; padding: 40px; color: var(--text-secondary);">
                        <span class="material-icons" style="font-size: 48px;">auto_awesome</span>
                        <p>Auto-allocation completed!</p>
                    </div>
                `;
            } catch (error) {
                console.error('Error in auto assignment:', error);
                alert('Failed to auto-assign');
            }
        }

        // Load disasters on page load
        loadDisasters();
        
        // Refresh every 10 seconds
        setInterval(() => {
            if (!selectedDisaster) {
                loadDisasters();
            }
        }, 10000);
    </script>
</body>
</html>
